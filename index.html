<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - تعديل الرصيد</title>
    <style>
        body { font-family: Arial; direction: rtl; padding: 20px; background: #f1f1f1; }
        input { padding: 10px; width: 300px; margin: 10px 0; border-radius: 6px; border: 1px solid #aaa; }
        button { padding: 10px 20px; background: #007bff; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<h2>تعديل رصيد المستخدم في الـ Firebase</h2>

<label>اكتب ID المستخدم:</label><br>
<input type="text" id="userId"><br>

<label>اكتب الرصيد الجديد:</label><br>
<input type="number" id="newMoney"><br>

<button onclick="updateMoney()">تحديث الرصيد</button>

<p id="result"></p>

<script type="module">

    // Import Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-analytics.js";
    import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

    // Your Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyAKGrxv_GT3T3krYeYY5C-o7VmvLkG-gw0",
        authDomain: "cashapp-405b7.firebaseapp.com",
        databaseURL: "https://cashapp-405b7-default-rtdb.firebaseio.com",
        projectId: "cashapp-405b7",
        storageBucket: "cashapp-405b7.firebasestorage.app",
        messagingSenderId: "146496743526",
        appId: "1:146496743526:web:edc0318c7f3affa25465a7",
        measurementId: "G-NWMR38V1B9"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);

    // Function to update money value
    window.updateMoney = function() {
        const id = document.getElementById("userId").value.trim();
        const money = document.getElementById("newMoney").value;

        if (!id || money === "") {
            document.getElementById("result").innerHTML = "⚠️ يرجى تعبئة جميع الحقول!";
            return;
        }

        const userRef = ref(db, "users/" + id);

        update(userRef, { money: Number(money) })
            .then(() => {
                document.getElementById("result").style.color = "green";
                document.getElementById("result").innerHTML = "✔️ تم تحديث الرصيد بنجاح!";
            })
            .catch((err) => {
                document.getElementById("result").style.color = "red";
                document.getElementById("result").innerHTML = "❌ حدث خطأ: " + err;
            });
    }

</script>

</body>
</html>
